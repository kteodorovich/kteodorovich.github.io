<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
      content="{{ page.description | default: site.description | escape }}">

  <title>
    {% if page.title == "Home" %}
      Katya Teodorovich
    {% else %}
      {{ page.title }} | Katya Teodorovich
    {% endif %}
  </title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>

<body>

  <div class="main">

    <header class="site-header">

      <h1>Katya Teodorovich</h1>

      <div class="social-links">

        <a
          class="social-button"
          href="https://www.linkedin.com/in/kteodorovich"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
          </svg>

          <span>LinkedIn</span>
        </a>

        <a
          class="social-button"
          href="https://github.com/kteodorovich"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path>
          </svg>

          <span>GitHub</span>
        </a>

        <a
          class="social-button"
          href="{{ '/attachments/resume.pdf' | relative_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M8 13h8"></path>
            <path d="M8 17h5"></path>
          </svg>

          <span>Resume</span>
        </a>

      </div>

    </header>

    <nav class="tabs" aria-label="Site sections">

      <a
        class="tab-link"
        href="{{ '/' | relative_url }}"
        {% if page.url == "/" %}aria-current="page"{% endif %}
      >
        Home
      </a>

      <a
        class="tab-link"
        href="{{ '/piping/' | relative_url }}"
        {% if page.url == "/piping/" %}aria-current="page"{% endif %}
      >
        Piping
      </a>

      <a
        class="tab-link"
        href="{{ '/projects/' | relative_url }}"
        {% if page.url == "/projects/" %}aria-current="page"{% endif %}
      >
        Projects
      </a>

      <a
        class="tab-link"
        href="{{ '/thoughts/' | relative_url }}"
        {% if page.url == "/thoughts/" %}aria-current="page"{% endif %}
      >
        Thoughts
      </a>

    </nav>

    <main class="tab-panel">
      <div class=""document">
        {{ content }}
      </div>
    </main>

    <footer class="footer">
      <hr>

      <p>
        Last updated:
        <span id="last-commit-date">...</span>
      </p>
    </footer>

  </div>

  <script src="{{ '/main.js' | relative_url }}"></script>

</body>
</html>
