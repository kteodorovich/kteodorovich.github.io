<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <title>
    {% if page.title == "Home" %}
      Katya Teodorovich
    {% else %}
      {{ page.title }} | Katya Teodorovich
    {% endif %}
  </title>

  <link rel="icon" href="{{ '/attachments/icons/favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css"
  >

  <link
    rel="stylesheet"
    href="{{ '/styles.css' | relative_url }}"
  >
</head>

<body>

  <div class="main-wrapper">
  <div class="main">

    <header class="site-header">

      <h1>Katya Teodorovich</h1>

      <div class="social-links">

        <!-- LinkedIn -->
        <a
          class="social-button"
          href="https://www.linkedin.com/in/kteodorovich"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="social-icon linkedin-icon"
            src="{{ '/attachments/icons/linkedin.svg' | relative_url }}"
            width="12"
            height="12"
            alt=""
            aria-hidden="true"
          >

          <span>LinkedIn</span>
        </a>


        <!-- GitHub -->
        <a
          class="social-button"
          href="https://github.com/kteodorovich"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="social-icon"
            src="{{ '/attachments/icons/github.svg' | relative_url }}"
            width="12"
            height="12"
            alt=""
            aria-hidden="true"
          >

          <span>GitHub</span>
        </a>


        <!-- Resume -->
        <a
          class="social-button"
          href="{{ '/attachments/resume.pdf' | relative_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="social-icon"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M8 13h8"></path>
            <path d="M8 17h5"></path>
          </svg>

          <span>Resume</span>
        </a>

      </div>

    </header>


    <nav class="tabs" aria-label="Site sections">

      <a
        class="tab-link"
        href="{{ '/' | relative_url }}"
        {% if page.url == "/" %}aria-current="page"{% endif %}
      >
        Home
      </a>

      <a
        class="tab-link"
        href="{{ '/piping/' | relative_url }}"
        {% if page.url == "/piping/" %}aria-current="page"{% endif %}
      >
        Piping
      </a>

      <a
        class="tab-link"
        href="{{ '/projects/' | relative_url }}"
        {% if page.url == "/projects/" %}aria-current="page"{% endif %}
      >
        Projects
      </a>

      <a
        class="tab-link"
        href="{{ '/thoughts/' | relative_url }}"
        {% if page.url == "/thoughts/" %}aria-current="page"{% endif %}
      >
        Thoughts
      </a>

    </nav>


    <main class="tab-panel">

      <div class="document">
        {{ content }}
      </div>

    </main>


    <footer class="footer">

      <hr>

      <p>
        Last updated:
        <span id="last-commit-date">...</span>
      </p>

    </footer>

  </div>
  </div>


  <script src="{{ '/main.js' | relative_url }}"></script>

</body>
</html>
